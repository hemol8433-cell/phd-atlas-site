<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>PhD Atlas · 私人科研工作台</title>
<link rel="stylesheet" href="./research.css">
<style>
.public-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 8%,#e3f2ed 0,transparent 45%),linear-gradient(145deg,#f9fbff,#edf0fa)}
.public-card{width:min(520px,100%);padding:38px;background:#fff;border:1px solid #dfe5ee;border-radius:24px;box-shadow:0 25px 75px #293e7013;text-align:center}
.public-symbol{width:64px;height:64px;background:#dff1e9;color:#3b8474;display:grid;place-items:center;font-size:36px;margin:0 auto 20px;border-radius:20px}
.public-card h1{font-size:29px;margin:0 0 10px;letter-spacing:-.6px}.public-card p{color:#64748b;margin:0 0 24px;line-height:1.8}
.public-card button{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;background:#575ed1;color:white;padding:14px 24px;font-weight:760;width:100%}
.public-card button:disabled{background:#a4acba}
.public-card small{display:block;margin-top:21px;color:#7b879a}
#authMessage{font-size:12px;margin-top:20px;color:#66748c;min-height:20px}
</style>
<script src="./auth-config.js"></script>
</head>
<body>
<main class="public-shell"><section class="public-card">
<div class="public-symbol">✳</div>
<span class="pill blue">PRIVATE RESEARCH SPACE</span>
<h1>PhD Atlas</h1>
<p>一个记录科研进展、实验、文献阅读和博士成长的私人工作台。<br>所有个人记录仅对授权主人开放。</p>
<button type="button" disabled id="githubLogin">◉ 使用 GitHub 安全登录</button>
<div id="authMessage" role="status">正在检查登录服务…</div>
<small>公开的是登录入口，不是科研记录或文献数据。</small>
</section></main>
<script type="module" src="./login.js?v=20261020-2"></script>
</body>
</html>
