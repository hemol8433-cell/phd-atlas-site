name: Validate Public Login Client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check docs/research.js
          node --check docs/projectday.js
          node --check docs/life.js
          node --check docs/vault.js
          node --check docs/daybook.js
          node --check docs/weekboard.js
          node --check docs/auth-core.js
          node --check docs/auth-gate.js
          node --check docs/login.js
          node --check docs/auth-config.js
      - name: Test login session states
        run: node tests/auth-session.mjs
      - name: Test ProjectDay workflows
        run: node tests/projectday.mjs
      - name: Test personal modules
        run: node tests/personal-modules.mjs
      - name: Test private daily schedule
        run: node tests/daybook.mjs
      - name: Test seven-day synchronized schedule
        run: node tests/weekboard.mjs
      - name: Verify focus and life check-in synchronization
        run: node tests/focus-sync.mjs
      - name: Validate public/private file boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          docs=Path('docs')
          allowed={'index.html','app.html','auth-config.js','auth-core.js',
                   'auth-gate.js','login.js','research.css','research.js',
                   'papers.html','.nojekyll','projectday.js','projectday.css','life.js','vault.js','personal-refresh.css','daybook.js','minimal-home.css','weekboard.js','weekboard.css'}
          found={p.name for p in docs.rglob('*') if p.is_file()}
          assert found==allowed, f'Unexpected public assets: {found.symmetric_difference(allowed)}'
          assert 'githubLogin' in (docs/'index.html').read_text()
          assert 'auth-gate.js' in (docs/'app.html').read_text()
          assert 'projectday.css' in (docs/'app.html').read_text()
          assert 'projectday.js' in (docs/'research.js').read_text()
          assert 'life.js' in (docs/'research.js').read_text()
          assert 'vault.js' in (docs/'research.js').read_text()
          assert 'personal-refresh.css' in (docs/'app.html').read_text()
          assert 'minimal-home.css' in (docs/'app.html').read_text()
          assert 'weekboard.js' in (docs/'research.js').read_text()
          assert 'weekboard.css' in (docs/'app.html').read_text()
          assert 'data-view="schedule"' not in (docs/'app.html').read_text()
          assert 'data-view="schedule"' not in (docs/'research.js').read_text()
          assert 'id="homeDaybook"' in (docs/'app.html').read_text()
          assert 'sb_publishable_' in (docs/'auth-config.js').read_text()
          assert not (docs/'data/papers.json').exists()
          assert not Path('private_data').exists()
          js=(docs/'research.js').read_text()
          ids=set(re.findall(r'\$\(\x27([^\x27]+)\x27\)',js))
          html=(docs/'app.html').read_text()
          declared=set(re.findall(r'id="([^"]+)"',html))
          assert not ids-declared, f'Missing DOM IDs: {ids-declared}'
          print('Public static boundary and DOM wiring verified.')
          PY
